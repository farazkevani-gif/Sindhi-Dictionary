name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            wget \
            curl \
            autoconf \
            automake \
            autopoint \
            gettext \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5 \
            libssl-dev \
            libffi-dev \
            libsqlite3-dev \
            cmake \
            build-essential \
            ccache

      - name: Install Python build tools
        run: |
          python -m pip install --upgrade pip setuptools wheel
          
          # Install a newer/compatible buildozer and tools stack
          python -m pip install \
            git+https://github.com/kivy/buildozer.git@master \
            cython==0.29.33 \
            kivy

      - name: Patch p4a venv pip invocation (Fix BuildDependencyInstallError)
        run: |
          # Locate where python-for-android creates virtual environments and pin pip inside it or patch the call
          PYTHON_FOR_ANDROID_DIR=$(python -c "import pythonfor_android; import os; print(os.path.dirname(pythonfor_android.__file__))" 2>/dev/null || echo "")
          echo "Found p4a at: $PYTHON_FOR_ANDROID_DIR"
          
          # If p4a is installed, we can look for bootstrap files, or let buildozer use a pinned pip constraint
          echo "Creating pip constraint to prevent upgrading to broken pip versions inside p4a venvs..."
          mkdir -p ~/.pip
          echo "pip<=24.0" > ~/.pip/constraints.txt

      - name: Verify environment
        run: |
          echo "=========================================="
          echo "ENVIRONMENT"
          echo "=========================================="
          python --version
          java -version
          buildozer --version
          cython --version
          echo "=========================================="

      - name: Verify project files
        run: |
          test -f buildozer.spec
          test -f dictionary_stage14_grouped.csv
          test -f dictionary_stage18_reverse_index.json
          test -f dictionary_stage22_android.db
          echo "Required files: OK"

      - name: Build APK with Buildozer
        env:
          BUILDOZER_ALLOW_ROOT: "1"
          BUILDOZER_WARN_ON_ROOT: "0"
          BUILDOZER_ACCEPT_SDK_LICENSES: "1"
          PIP_CONSTRAINT: "/home/runner/.pip/constraints.txt"
        run: |
          echo "=========================================="
          echo "ANDROID BUILD STARTING"
          echo "=========================================="

          buildozer -v android debug

          echo "=========================================="
          echo "ANDROID BUILD FINISHED"
          echo "=========================================="
          ls -lah bin/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SindhiDictionary-APK
          path: bin/*.apk
          if-no-files-found: error

      - name: Upload Buildozer logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SindhiDictionary-Build-Logs
          path: |
            .buildozer/
            bin/
          if-no-files-found: ignore
