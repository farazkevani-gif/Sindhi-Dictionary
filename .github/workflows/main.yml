name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # =========================================================
      # CHECKOUT
      # =========================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # =========================================================
      # JAVA 17
      # No Gradle cache — this is a Buildozer/Kivy project.
      # =========================================================

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"


      # =========================================================
      # PYTHON
      # =========================================================

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"


      # =========================================================
      # VERIFY ENVIRONMENT
      # =========================================================

      - name: Verify environment
        run: |
          echo "=========================================="
          echo "ENVIRONMENT"
          echo "=========================================="

          echo "User:"
          whoami

          echo
          echo "UID:"
          id -u

          echo
          echo "Python:"
          python --version

          echo
          echo "Python path:"
          which python

          echo
          echo "Pip:"
          python -m pip --version

          echo
          echo "Java:"
          java -version

          echo
          echo "=========================================="


      # =========================================================
      # SYSTEM DEPENDENCIES
      # =========================================================

      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            autopoint \
            gettext \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5 \
            libssl-dev \
            libffi-dev \
            libsqlite3-dev \
            cmake \
            build-essential \
            ccache


      # =========================================================
      # PYTHON BUILD TOOLS
      # =========================================================

      - name: Install Python build tools
        run: |
          python -m pip install --upgrade pip setuptools wheel

          python -m pip install \
            buildozer \
            cython==0.29.33 \
            kivy


      # =========================================================
      # VERIFY BUILDOZER
      # =========================================================

      - name: Verify Buildozer
        run: |
          echo "=========================================="
          echo "BUILDOZER"
          echo "=========================================="

          echo "Buildozer:"
          which buildozer

          echo
          buildozer --version

          echo
          echo "Cython:"
          cython --version

          echo "=========================================="


      # =========================================================
      # VERIFY PROJECT
      # =========================================================

      - name: Verify project files
        run: |
          echo "=========================================="
          echo "PROJECT FILES"
          echo "=========================================="

          pwd

          echo
          echo "Project:"
          find . -maxdepth 2 -type f | sort

          echo
          echo "Checking required files..."

          test -f main.py
          test -f buildozer.spec
          test -f dictionary_stage14_grouped.csv
          test -f dictionary_stage18_reverse_index.json
          test -f fonts/NotoSansArabic-Regular.ttf

          echo
          echo "Required files: OK"

          echo
          echo "Buildozer configuration:"
          cat buildozer.spec

          echo
          echo "=========================================="


      # =========================================================
      # BUILD APK
      # =========================================================

      - name: Build APK with Buildozer
        env:
          BUILDOZER_WARN_ON_ROOT: "0"
        run: |
          echo "=========================================="
          echo "ANDROID BUILD STARTING"
          echo "=========================================="

          buildozer -v android debug

          echo
          echo "=========================================="
          echo "ANDROID BUILD FINISHED"
          echo "=========================================="

          echo
          echo "APK FILES:"
          ls -lah bin/


      # =========================================================
      # UPLOAD APK
      # =========================================================

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SindhiDictionary-APK
          path: bin/*.apk
          if-no-files-found: error


      # =========================================================
      # UPLOAD BUILD LOGS IF ANY
      # =========================================================

      - name: Upload Buildozer logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SindhiDictionary-Build-Logs
          path: |
            .buildozer/
            bin/
          if-no-files-found: ignore
