name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # =========================================================
      # CHECKOUT
      # =========================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # =========================================================
      # JAVA 17
      # =========================================================

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"


      # =========================================================
      # PYTHON 3.10
      # =========================================================

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"


      # =========================================================
      # SYSTEM DEPENDENCIES
      # =========================================================

      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            autopoint \
            gettext \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5 \
            libssl-dev \
            libffi-dev \
            libsqlite3-dev \
            cmake \
            build-essential \
            ccache


      # =========================================================
      # PYTHON BUILD TOOLS
      # =========================================================

      - name: Install Python build tools
        run: |
          python -m pip install --upgrade pip setuptools wheel

          python -m pip install \
            buildozer \
            cython==0.29.33 \
            kivy


      # =========================================================
      # VERIFY ENVIRONMENT
      # =========================================================

      - name: Verify environment
        run: |
          echo "=========================================="
          echo "ENVIRONMENT"
          echo "=========================================="

          echo "User:"
          whoami

          echo
          echo "Python:"
          python --version

          echo
          echo "Java:"
          java -version

          echo
          echo "Buildozer:"
          buildozer --version

          echo "=========================================="


      # =========================================================
      # ANDROID SDK LICENSES
      # =========================================================

      - name: Prepare Android SDK
        env:
          ANDROID_HOME: /home/runner/.buildozer/android/platform/android-sdk
          ANDROID_SDK_ROOT: /home/runner/.buildozer/android/platform/android-sdk
        run: |
          echo "=========================================="
          echo "ANDROID SDK LICENSE SETUP"
          echo "=========================================="

          mkdir -p "$ANDROID_HOME/licenses"

          echo "Accepting Android SDK licenses..."

          yes | sdkmanager --licenses || true

          echo "=========================================="


      # =========================================================
      # VERIFY PROJECT
      # =========================================================

      - name: Verify project files
        run: |
          echo "=========================================="
          echo "PROJECT FILES"
          echo "=========================================="

          echo "Working directory:"
          pwd

          echo
          echo "Project files:"
          find . -maxdepth 2 -type f -not -path "./.git/*" | sort

          echo
          echo "Checking required files..."

          test -f buildozer.spec
          test -f dictionary_stage14_grouped.csv
          test -f dictionary_stage18_reverse_index.json
          test -f fonts/NotoSansArabic-Regular.ttf

          echo
          echo "Required files: OK"

          echo
          echo "Buildozer configuration:"
          cat buildozer.spec

          echo
          echo "Project verification completed successfully."


      # =========================================================
      # BUILD APK
      # =========================================================

      - name: Build APK with Buildozer
        env:
          BUILDOZER_ALLOW_ROOT: "1"
          BUILDOZER_WARN_ON_ROOT: "0"
          BUILDOZER_ACCEPT_SDK_LICENSES: "1"
          ANDROID_HOME: /home/runner/.buildozer/android/platform/android-sdk
          ANDROID_SDK_ROOT: /home/runner/.buildozer/android/platform/android-sdk
        run: |
          echo "=========================================="
          echo "ANDROID BUILD STARTING"
          echo "=========================================="

          buildozer -v android debug

          echo
          echo "=========================================="
          echo "ANDROID BUILD FINISHED"
          echo "=========================================="

          echo
          echo "APK FILES:"
          ls -lah bin/


      # =========================================================
      # UPLOAD APK
      # =========================================================

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SindhiDictionary-APK
          path: bin/*.apk
          if-no-files-found: error


      # =========================================================
      # UPLOAD BUILD LOGS
      # =========================================================

      - name: Upload Buildozer logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SindhiDictionary-Build-Logs
          path: |
            .buildozer/
            bin/
          if-no-files-found: ignore
